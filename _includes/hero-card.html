<section class="carousel">
   <div class="hero-card-container">
        <div class="hero-card">
            <div class="hero-card-content">
                <h3>Hello <b>{{ page.title }}</b></h3>
                <h4>Goodbye {{ page.product.goodbye }}</h4>
                <div class="requirements">
                    Requirements:
                    <ul>
                        {% for item in page.requirements %}
                            <li>{{ item }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>

            <div class="hero-card-footer">
                {% include checkout-buttons.html %}
            </div>
            <img src="{{ page.product.box }}" alt="{{ page.title }}">
        </div>
   </div>
</section>
