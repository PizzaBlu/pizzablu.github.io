<section>
    <div class="hero-card">
        <div class="hero-card-content">
            <h3>Hello <b>{{ page.title }}</b></h3>
            <h4>Goodbye {{ page.product.goodbye }}</h4>
            <div class="requirements desktop-only">
                Requirements:
                <ul>
                    {% for item in page.requirements %}
                        <li>{{ item }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        <div class="hero-card-footer desktop-only">
            {% include checkout-buttons.html %}
        </div>
        <img
            src="{{ page.product.box }}"
            alt="box art for {{ page.title }}"
            fetchpriority=high
        >
    </div>
</section>
