<head>
    <meta charset="UTF-8" />

    <!-- Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- CSS -->
    <link rel="stylesheet" href="/css/main.css">

    <style>
        body {
            background-color: {{ site.colors.background }};
            color: {{ site.colors.text }};
            font-family: Outfit, sans-serif;
        }
    </style>

    <!-- Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

    <style>
        /* Outfit Latin */
        @font-face {
            font-family: 'Outfit';
            font-style: normal;
            font-weight: 100 900;
            font-display: swap;
            src: url(https://fonts.gstatic.com/s/outfit/v14/QGYvz_MVcBeNP4NJtEtqUYTkntBJ.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
    </style>

    <!-- Animation Continuity -->
    <script>
        const elapsed = Date.now() % 360000;
        document.documentElement.style.setProperty('--animation-delay', `-${elapsed}ms`);
    </script>

    <!-- Preload -->
    <link rel="preload" href="/assets/tile_half.png" as="image">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- HTML Meta Tags -->
    <title>{{ site.title }} - {{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <link rel="canonical" href="{{ site.url }}{{ page.permalink }}"/>
    
    <!-- favicon -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml">

    <!-- preconnect -->
    <link rel="preconnect" href="https://creem.io" crossorigin>
    <link rel="preconnect" href="https://youtube.com" crossorigin>
    <link rel="preconnect" href="https://discord.gg" crossorigin>

    <!-- Open Graph Meta Tags -->
    <meta property="og:url" content="{{ site.url }}">
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ site.title }} - {{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:image" content="https://pizzablufx.com/assets/banner.png">

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="{{ site.domain }}">
    <meta property="twitter:url" content="{{ site.url }}">
    <meta name="twitter:title" content="{{ site.title }} - {{ page.title }}">
    <meta name="twitter:description" content="{{ page.description }}">
    <meta name="twitter:image" content="https://pizzablufx.com/assets/banner.png">
</head>
