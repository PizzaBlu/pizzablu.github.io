<section>
    {% if include.title %}
        <h3>{{ include.title }}</h3>
    {% endif %}
</section>
<section class="carousel carousel-scroll-container">
    <div class="carousel-container">
        <div class="carousel-items">
            {% for card in include.items %}
                {% include card.html card=card %}
            {% endfor %}
        </div>
    </div>
</section>
